# ──────────────────────────────────────────────────────────────────────────────
# HuGuard AI – Docker Compose (100% local, no paid APIs)
# Requires: Ollama running on the host machine (port 11434)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend (FastAPI + LangGraph) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huguard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override Ollama URL so the container can reach the host
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      DATABASE_URL: "/app/data/huguard.db"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite checkpoint DB and uploaded files
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - huguard-net
    extra_hosts:
      # Allow container to reach host's Ollama
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Frontend (Next.js 14+ App Router) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: huguard-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huguard-net

volumes:
  backend_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  huguard-net:
    driver: bridge
