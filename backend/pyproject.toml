[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type for self
    "ANN102",  # Missing type for cls
    "S101",    # Use of assert (fine in tests)
    "B008",    # Do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012",  # Mutable class attributes (Pydantic models)
]
exclude = ["tests/", "alembic/"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"app/main.py" = ["ANN"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
data_file = "/tmp/.coverage"
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
