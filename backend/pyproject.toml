[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",    # Use of assert (fine in tests)
    "B008",    # Do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012",  # Mutable class attributes (Pydantic models)
    "RUF001",  # Ambiguous unicode characters in string
    "RUF002",  # Ambiguous unicode characters in docstring
    "RUF003",  # Ambiguous unicode characters in comment
    "S104",    # Possible binding to all interfaces (0.0.0.0 is intended in Docker)
    "S603",    # subprocess call check
    "S607",    # starting process with partial executable path
    "E501",    # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
data_file = "/tmp/.coverage"
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
